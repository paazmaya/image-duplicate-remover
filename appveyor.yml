# http://www.appveyor.com/docs/appveyor-yml

image:
  - Visual Studio 2022

environment:
  NODE_SKIP_PLATFORM_CHECK: 1
  nodejs_version: "24"
  IE_BIN: "%PROGRAMFILES%\\Internet Explorer\\iexplore.exe"

version: "{build}-{branch}"

init:
  - git config --global core.longpaths true
  - dir "%PROGRAMFILES%\Internet Explorer"

clone_depth: 1

cache:
  - node_modules -> npm-shrinkwrap.json, appveyor.yml

install:
  - ps: Install-Product node $env:nodejs_version
  - appveyor DownloadFile "https://deac-ams.dl.sourceforge.net/project/graphicsmagick/graphicsmagick-binaries/1.3.45/GraphicsMagick-1.3.45-Q16-win64-dll.exe"
  - ps: if ((Get-FileHash "GraphicsMagick-1.3.45-Q16-win64-dll.exe" -Algorithm SHA256).Hash -ne "5D45760921F11E051C0B804455036A03BEAC9C1E3992AC2B234FDD9BA67B62FC") { throw "SHA256 mismatch" }
  - GraphicsMagick-1.3.45-Q16-win64-dll.exe /SP /VERYSILENT /NORESTART /NOICONS /DIR=%CD%\gm
  - set PATH=%CD%\gm;%PATH%
  - npm ci --ignore-scripts
  - npm rebuild --ignore-scripts=false better-sqlite3

test_script:
  - node --version
  - npm --version
  - gm version
  - npm run lint
  - npm test

build: off
